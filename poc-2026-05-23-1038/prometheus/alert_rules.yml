groups:
- name: NodeAlerts
  rules:
  - alert: NodeDown
    expr: up == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      description: 'Node {{ $labels.instance }} is down'
  - alert: HighCPU
    expr: 100 - (100 * idle)
    for: 1m
    labels:
      severity: warning
    annotations:
      description: 'CPU usage is high on node {{ $labels.instance }}'